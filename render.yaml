# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates one web service with a persistent disk for the SQLite database.
services:
  - type: web
    name: program-manager
    runtime: node
    plan: starter            # a persistent disk needs a paid instance
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/app.db
      # 1 = load the demo program and show demo sign-ins. Set to 0 and use ADMIN_* for real data.
      - key: DEMO_MODE
        value: "1"
      - key: PROGRAM_NAME
        value: Ridgeview Football
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Public URL of this service, e.g. https://program-manager.onrender.com (used for Google sign-in callbacks)
      - key: APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_KEY
        generateValue: true
