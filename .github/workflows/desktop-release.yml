# Builds the Windows installer on a real Windows machine and publishes it as a GitHub Release.
# The installed app checks these releases and updates itself.
# Release a new version: bump "version" in desktop/package.json and push. Pushing a v* tag or
# running this workflow from the Actions tab also works.
name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/fervent-pascal-jkunps', 'main']
    paths: ['desktop/package.json', '.github/workflows/desktop-release.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the app's tests
        run: npm test
      - name: Install desktop build tools
        working-directory: desktop
        run: npm ci
      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          if ! gh release view "v$v" >/dev/null 2>&1; then
            notes="docs/release-notes/v$v.md"
            if [ -f "$notes" ]; then
              gh release create "v$v" --target "$GITHUB_SHA" --title "Program Manager $v" --notes-file "$notes"
            else
              gh release create "v$v" --target "$GITHUB_SHA" --title "Program Manager $v" \
                --notes "Download ProgramManager-Setup.exe below and run it. Installed copies download updates in the background and install them when the app restarts."
            fi
          fi
          # electron-updater needs the versioned installer, its .blockmap (differential downloads) and latest.yml.
          # The version-less copy gives the web app a permanent link:
          # https://github.com/oofski/ManagementPlatform/releases/latest/download/ProgramManager-Setup.exe
          cp "desktop/dist/ProgramManager-Setup-$v.exe" desktop/dist/ProgramManager-Setup.exe
          gh release upload "v$v" "desktop/dist/ProgramManager-Setup-$v.exe" "desktop/dist/ProgramManager-Setup-$v.exe.blockmap" desktop/dist/latest.yml desktop/dist/ProgramManager-Setup.exe --clobber
      - name: Keep a copy of the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: ProgramManager-Setup
          path: desktop/dist/*.exe
